<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Childhood Trauma Test (ACES Test) – Discover the Impact & Begin Healing</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0F1018; --accent:#5ACFB3; --card:#191C2D; --prog-bg:#252535;
      --text:#FAFAFA; --muted:#8E92AF; --btn:#252535; --btn-h:#2E3048;
      --sel-bg:rgba(90,207,179,.12); --sel-bd:#5ACFB3;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg) url('assets/bg_audio.ec4a8525.webp') center 0/100% auto no-repeat;
      min-height:100vh;font-family:'Poppins',-apple-system,sans-serif;
      color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    #app{max-width:450px;margin:0 auto;min-height:100vh;
      display:flex;flex-direction:column;padding:0 16px 60px}
    .screen{animation:fadeIn .22s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* HEADER */
    .hdr{display:flex;justify-content:center;padding:20px 0 0}
    .logo{font-size:17px;font-weight:800;letter-spacing:.5px;color:var(--accent)}

    /* PROGRESS BAR */
    .prog-wrap{width:85%;max-width:333px;margin:40px auto 0}
    .prog-track{position:relative;display:flex;width:100%;height:3px;
      background:var(--prog-bg);border-radius:3px;align-items:center}
    .p-sec{position:relative;flex:1;height:3px}
    .p-fill{position:absolute;top:0;left:0;height:3px;background:var(--accent);
      border-radius:3px;transition:width .35s ease}
    .p-dot{position:absolute;right:-9px;top:50%;transform:translateY(-50%);
      width:18px;height:18px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:700;z-index:2}
    .p-dot.done{background:var(--accent);color:#0F1018}
    .p-dot.active{background:var(--accent);color:#0F1018;width:20px;height:20px;right:-10px}
    .p-dot.next{background:var(--prog-bg);color:var(--muted);border:1.5px solid rgba(255,255,255,.15)}
    .p-lbl{position:absolute;top:-22px;left:50%;transform:translateX(-50%);
      white-space:nowrap;font-size:11px;font-weight:600;color:var(--accent)}

    /* BACK */
    .back{background:none;border:none;color:var(--muted);font-family:inherit;
      font-size:14px;cursor:pointer;padding:10px 0 0;
      display:flex;align-items:center;gap:5px;align-self:flex-start}
    .back:hover{color:var(--text)}

    /* PRE-QUIZ */
    .pre{display:flex;flex-direction:column;align-items:center;padding:48px 0 32px;gap:22px}
    .pre-title{font-size:26px;font-weight:700;line-height:32px;
      letter-spacing:-.5px;text-align:center}
    .pre-img{width:100%;max-width:320px;border-radius:18px;object-fit:cover;max-height:200px}
    .g-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
    .g-btn{background:var(--btn);border:1.5px solid rgba(255,255,255,.08);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:16px;font-weight:500;padding:20px 12px;cursor:pointer;text-align:center;
      transition:border-color .15s,background .15s}
    .g-btn:hover{background:var(--btn-h)}
    .g-btn.sel{background:var(--sel-bg);border-color:var(--sel-bd);color:var(--accent)}
    .a-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;width:100%}
    .a-btn{background:var(--btn);border:1.5px solid rgba(255,255,255,.08);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:16px;font-weight:500;padding:17px 12px;cursor:pointer;
      transition:border-color .15s,background .15s}
    .a-btn:hover{background:var(--btn-h)}
    .a-btn.sel{background:var(--sel-bg);border-color:var(--sel-bd);color:var(--accent)}

    /* QUESTION */
    .q-area{display:flex;flex-direction:column;align-items:center;
      padding:22px 0 16px;gap:18px;width:100%}
    .q-text{font-size:22px;font-weight:700;line-height:28px;
      letter-spacing:-.4px;text-align:center;width:100%}
    .q-img{width:100%;max-width:320px;border-radius:18px;
      object-fit:cover;max-height:210px}
    .answers{display:flex;flex-direction:column;gap:10px;width:100%}
    .ans{background:var(--btn);border:1.5px solid rgba(255,255,255,.08);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:16px;font-weight:500;line-height:22px;
      padding:16px 20px;cursor:pointer;text-align:left;
      transition:border-color .15s,background .15s,transform .1s;width:100%}
    .ans:hover{background:var(--btn-h);transform:translateY(-1px)}
    .ans:active{transform:translateY(0)}
    .ans.sel{background:var(--sel-bg);border-color:var(--sel-bd);color:var(--accent)}

    /* MULTI-SELECT */
    .multi-hint{font-size:12px;color:var(--muted);text-align:center;width:100%}
    .continue-btn{background:var(--accent);color:#0F1018;border:none;border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:700;padding:16px;
      cursor:pointer;width:100%;transition:opacity .15s,transform .1s;margin-top:4px}
    .continue-btn:hover{opacity:.9;transform:translateY(-1px)}
    .continue-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    /* STATEMENT CARD */
    .stmt-lbl{font-size:13px;color:var(--muted);font-weight:500;text-align:center}
    .stmt-card{background:var(--card);border-radius:16px;padding:18px 20px;width:100%;
      font-size:16px;line-height:24px;border-left:3px solid var(--accent);font-style:italic}

    /* DISCLAIMER */
    .disc{background:var(--card);border-radius:14px;padding:16px 20px;
      font-size:14px;line-height:22px;color:var(--muted);text-align:center;width:100%}

    /* AUDIO PLAYER */
    .audio-wrap{display:flex;align-items:center;gap:16px;background:var(--card);
      border-radius:20px;padding:16px 20px;width:100%}
    .play-btn{width:52px;height:52px;border-radius:50%;flex-shrink:0;
      background:var(--accent);border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:transform .15s,opacity .15s;position:relative}
    .play-btn::before{content:'';position:absolute;inset:0;border-radius:50%;
      background:rgba(90,207,179,.3);animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
    .play-btn svg{position:relative;z-index:1}
    .play-btn.playing .pi{display:none}
    .play-btn.playing .pa{display:block}
    .pa{display:none}
    .waveform{display:flex;align-items:center;gap:3px;flex:1;height:44px}
    .wb{flex:1;border-radius:3px;background:#8E92AF}
    .waveform.playing .wb{animation:wv .6s ease-in-out infinite alternate;background:var(--accent)}
    .wb:nth-child(2n){animation-delay:.1s}
    .wb:nth-child(3n){animation-delay:.2s}
    .wb:nth-child(4n){animation-delay:.05s}
    .wb:nth-child(5n){animation-delay:.15s}
    @keyframes wv{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
    .skip-audio{background:none;border:none;color:var(--muted);font-family:inherit;
      font-size:14px;cursor:pointer;text-decoration:underline}
    .skip-audio:hover{color:var(--text)}

    /* NAME INPUT */
    .name-input{background:var(--btn);border:1.5px solid rgba(255,255,255,.15);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:18px;font-weight:500;padding:18px 20px;width:100%;
      outline:none;transition:border-color .2s}
    .name-input::placeholder{color:var(--muted)}
    .name-input:focus{border-color:var(--accent)}

    /* POPUP OVERLAY */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);
      z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
    .popup{background:var(--card);border-radius:24px;padding:28px 24px;
      width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;
      animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
    @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
    .popup-tag{font-size:12px;font-weight:700;color:var(--accent);
      text-transform:uppercase;letter-spacing:1px}
    .popup-title{font-size:20px;font-weight:800;line-height:26px;letter-spacing:-.4px}
    .popup-text{font-size:14px;color:var(--muted);line-height:22px}
    .popup-quote{font-size:17px;font-weight:600;line-height:26px;
      font-style:italic;border-left:3px solid var(--accent);padding-left:14px}
    .popup-person{display:flex;align-items:center;gap:12px}
    .popup-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover}
    .popup-name-role p:first-child{font-size:14px;font-weight:700}
    .popup-name-role p:last-child{font-size:12px;color:var(--muted)}
    .popup-close{background:var(--accent);color:#0F1018;border:none;border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:700;padding:16px;
      cursor:pointer;width:100%;transition:opacity .15s}
    .popup-close:hover{opacity:.9}

    /* TRANSITION */
    .trans{display:flex;flex-direction:column;align-items:center;
      padding:60px 0 32px;gap:20px;text-align:center}
    .trans-icon{font-size:48px}
    .trans-title{font-size:24px;font-weight:700;letter-spacing:-.4px}
    .trans-text{font-size:15px;color:var(--muted);line-height:22px;max-width:300px}
    .trans-btn{background:var(--accent);color:#0F1018;border:none;border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:700;padding:16px 40px;
      cursor:pointer;margin-top:8px;transition:opacity .15s,transform .1s}
    .trans-btn:hover{opacity:.9;transform:translateY(-1px)}

    /* LOADING */
    .loading{display:flex;flex-direction:column;align-items:center;
      justify-content:center;min-height:100vh;gap:28px;padding:20px;text-align:center}
    .l-title{font-size:24px;font-weight:700;letter-spacing:-.4px}
    .l-sub{font-size:14px;color:var(--muted);line-height:22px;max-width:280px}
    .l-bar-wrap{width:100%;max-width:280px;height:6px;
      background:var(--prog-bg);border-radius:6px;overflow:hidden}
    .l-bar{height:6px;background:var(--accent);border-radius:6px;
      width:0%;animation:lp 5s ease forwards}
    @keyframes lp{from{width:0%}to{width:100%}}
    .l-steps{display:flex;flex-direction:column;gap:14px;
      width:100%;max-width:280px;text-align:left}
    .lstep{display:flex;align-items:center;gap:10px;font-size:14px;
      color:var(--muted);opacity:0;transition:opacity .4s}
    .lstep.on{opacity:1;color:var(--text)}
    .lstep-dot{width:8px;height:8px;border-radius:50%;
      background:var(--prog-bg);flex-shrink:0;transition:background .3s}
    .lstep.on .lstep-dot{background:var(--accent)}

    /* LOADING QUESTIONS */
    .lq-overlay{position:fixed;inset:0;z-index:50;
      display:flex;align-items:flex-end;padding:0 16px 40px;pointer-events:none}
    .lq-card{background:var(--card);border-radius:20px;padding:22px 20px;
      width:100%;max-width:450px;margin:0 auto;
      display:flex;flex-direction:column;gap:14px;
      opacity:0;transform:translateY(30px);
      transition:opacity .4s,transform .4s;pointer-events:all}
    .lq-card.show{opacity:1;transform:translateY(0)}
    .lq-text{font-size:16px;font-weight:600;line-height:24px}
    .lq-btns{display:flex;gap:10px}
    .lq-yes,.lq-no{flex:1;background:var(--btn);border:1.5px solid rgba(255,255,255,.08);
      border-radius:12px;color:var(--text);font-family:inherit;
      font-size:15px;font-weight:600;padding:14px;cursor:pointer;
      transition:background .15s,border-color .15s}
    .lq-yes:hover{background:var(--btn-h)}

    /* EMAIL CAPTURE */
    .email-screen{display:flex;flex-direction:column;align-items:center;
      padding:60px 0 40px;gap:22px;text-align:center}
    .email-badge{background:rgba(90,207,179,.12);border:1px solid rgba(90,207,179,.3);
      border-radius:24px;padding:6px 16px;font-size:13px;font-weight:600;
      color:var(--accent);letter-spacing:.3px}
    .email-title{font-size:24px;font-weight:800;line-height:30px;letter-spacing:-.5px}
    .email-sub{font-size:14px;color:var(--muted);line-height:20px;max-width:300px}
    .email-input{background:var(--btn);border:1.5px solid rgba(255,255,255,.15);
      border-radius:14px;color:var(--text);font-family:inherit;
      font-size:16px;font-weight:500;padding:18px 20px;width:100%;
      outline:none;transition:border-color .2s}
    .email-input::placeholder{color:var(--muted)}
    .email-input:focus{border-color:var(--accent)}
    .email-submit{background:var(--accent);color:#0F1018;border:none;border-radius:14px;
      font-family:inherit;font-size:17px;font-weight:700;padding:18px;
      cursor:pointer;width:100%;transition:opacity .15s,transform .1s}
    .email-submit:hover{opacity:.9;transform:translateY(-1px)}
    .email-note{font-size:12px;color:var(--muted)}

    /* RESULTS */
    .results{display:flex;flex-direction:column;align-items:center;
      padding:40px 0 80px;gap:24px;width:100%}
    .r-badge{background:rgba(90,207,179,.12);border:1px solid rgba(90,207,179,.3);
      border-radius:24px;padding:6px 16px;font-size:13px;font-weight:600;
      color:var(--accent);letter-spacing:.3px}
    .r-title{font-size:26px;font-weight:800;line-height:32px;
      letter-spacing:-.5px;text-align:center}
    .r-sub{font-size:14px;color:var(--muted);text-align:center;line-height:20px}
    .r-graph{width:100%;border-radius:18px}
    .score-row{display:flex;flex-direction:column;gap:14px;width:100%}
    .score-item{display:flex;flex-direction:column;gap:6px}
    .score-lr{display:flex;justify-content:space-between}
    .score-lbl{font-size:13px;font-weight:600;color:var(--muted)}
    .score-val{font-size:13px;font-weight:700;color:var(--accent)}
    .score-track{width:100%;height:6px;background:var(--prog-bg);border-radius:6px;overflow:hidden}
    .score-fill{height:6px;background:var(--accent);border-radius:6px;transition:width 1s ease}
    .divider{width:100%;height:1px;background:rgba(255,255,255,.07)}
    .experts{display:flex;flex-direction:column;gap:16px;width:100%}
    .exp-title{font-size:12px;font-weight:600;color:var(--muted);
      text-align:center;text-transform:uppercase;letter-spacing:1px}
    .exp-row{display:flex;gap:14px}
    .exp-card{flex:1;background:var(--card);border-radius:14px;padding:14px;
      display:flex;flex-direction:column;align-items:center;gap:8px}
    .exp-img{width:56px;height:56px;border-radius:50%;object-fit:cover}
    .exp-name{font-size:12px;font-weight:700;text-align:center}
    .exp-role{font-size:11px;color:var(--muted);text-align:center}
    .uni-row{display:flex;justify-content:center;gap:24px;align-items:center}
    .uni-logo{height:26px;opacity:.65;object-fit:contain}
    .end-sec{position:relative;width:100%;border-radius:20px;overflow:hidden;
      background:var(--card);padding:28px 20px;
      display:flex;flex-direction:column;align-items:center;gap:16px}
    .end-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25}
    .end-glare{position:absolute;top:0;right:0;width:60%;pointer-events:none;opacity:.5}
    .end-content{position:relative;z-index:1;
      display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
    .end-phones{display:flex;gap:12px;justify-content:center}
    .end-phone{width:42%;max-width:150px;border-radius:14px;object-fit:cover}
    .end-title{font-size:22px;font-weight:800;text-align:center;line-height:28px}
    .end-sub{font-size:14px;color:var(--muted);text-align:center;line-height:20px}
    .cta-sec{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
    .cta-cap{font-size:19px;font-weight:700;text-align:center;line-height:26px}
    .cta-btn{display:block;width:100%;max-width:380px;background:var(--accent);
      color:#0F1018;border:none;border-radius:18px;font-family:inherit;
      font-size:17px;font-weight:700;padding:18px 24px;text-align:center;
      text-decoration:none;cursor:pointer;transition:opacity .15s,transform .1s}
    .cta-btn:hover{opacity:.9;transform:translateY(-1px)}
    .cta-note{font-size:12px;color:var(--muted);text-align:center}
  </style>
</head>
<body>
<div id="app"></div>
<audio id="bg-music" src="assets/background_audio.mp3" loop preload="none"></audio>
<audio id="sfx-click" src="assets/click.mp3" preload="auto"></audio>
<audio id="q-audio"  src="assets/audio_01.mp3" preload="auto"></audio>

<script>
const SECS = ['Your history','Tendencies','Struggles signs','Final Question'];
const WAVE_H = [18,14,36,32,12,28,10,44,40,12,22,10,32,22,12,18,10,10,20,12,14,10,18,8,12,22,10,32,28,12,22,10,28,12,22,10];

// ── QUIZ FLOW ─────────────────────────────────────────────────────────────
const FLOW = [
  {type:'gender'},
  {type:'age'},

  // ── SECTION 0: Your history ──────────────────────────────────────────
  {type:'q',sec:0,text:'In your childhood, your parents were...',answers:[
    {t:'Happily married',s:0},{t:'Unhappily married',s:1},{t:'Divorced',s:2},
    {t:'I had only one parent',s:1},{t:'I had no parents',s:2}]},

  {type:'multi',sec:0,text:'How can you describe the environment you were growing up in?',answers:[
    {t:'Nurturing and supportive',s:0},{t:'Chaotic and unpredictable',s:2},
    {t:'Unstable and unsafe',s:2},{t:'Challenging and demanding',s:1},
    {t:'Economic hardship and scarcity',s:1},{t:'Neglectful and lonely',s:2}]},

  {type:'audio',sec:0,file:'assets/audio_01.mp3',
    disc:"You're about to hear a short sound.\nIt may feel unusual or slightly uncomfortable.",
    text:'What do you hear first?',answers:[
    {t:'Please stop',s:2},{t:'Breeze mom',s:0}]},

  {type:'q',sec:0,text:'Which memories from your childhood are prevalent?',
    img:'assets/question_3_with_image.d615f347.webp',answers:[
    {t:'Positive',s:0},{t:'Negative',s:2},
    {t:"I don't remember my childhood",s:2},{t:'Not sure',s:1}]},

  {type:'q',sec:0,text:'What situations trigger emotional reactions or flashbacks from your past?',answers:[
    {t:'Those relating to any abuse',s:2},{t:'When my feelings are neglected',s:2},
    {t:'When feeling helpless',s:2},{t:'When feeling trapped',s:2},
    {t:'Those related to loss',s:1}]},

  {type:'q',sec:0,text:'Have you ever had anger management issues or struggled with controlling your temper?',answers:[
    {t:'Yes',s:2},{t:'No',s:0},{t:'Sometimes',s:1},{t:'A couple of times',s:1}]},

  {type:'stmt',sec:0,lbl:'Can you relate to this statement?',
    stmt:'"I tend to cope with difficult emotions or memories by engaging in substance abuse, reckless driving, or the like."',answers:[
    {t:'Strongly relate',s:2},{t:'Somewhat relate',s:1},{t:'Hardly relate',s:0},{t:"Can't relate",s:0}]},

  {type:'q',sec:0,text:'Do you see depression or low mood as normal or just part of your everyday?',answers:[
    {t:'Yes, it feels normal to me',s:2},{t:'No, I don\'t struggle with this',s:0},
    {t:'Sometimes',s:1},{t:'Not sure',s:1}]},

  {type:'q',sec:0,text:'How long have you been feeling this way?',answers:[
    {t:'The last few weeks',s:0},{t:'In recent months',s:1},
    {t:'A few years',s:2},{t:'My whole life',s:2}]},

  // POPUP after Q9: "Did you know?"
  {type:'popup',popup:'ptsd'},

  // ── SECTION 1: Tendencies ────────────────────────────────────────────
  {type:'audio',sec:1,file:'assets/audio_02.mp3',
    disc:"You're about to hear a short sound.\nIt may feel unusual or slightly uncomfortable.",
    text:'What do you hear first?',answers:[
    {t:"Don't break it",s:1},{t:'Stop raging',s:2}]},

  {type:'q',sec:1,text:'What do you see first?',
    img:'assets/question_9_with_image.52ef51b0.webp',answers:[
    {t:'A mysterious woman',s:0},{t:'An evil woman',s:2}]},

  {type:'multi',sec:1,text:'What do you feel when being in the spotlight?',answers:[
    {t:'Satisfaction',s:0},{t:'Stress',s:2},{t:'Disconnection',s:2},
    {t:'Stress and discomfort',s:2},{t:'Satisfaction and joy',s:0}]},

  {type:'q',sec:1,text:'Do you tend to change your behavior to fit in with different social groups or situations?',answers:[
    {t:'Yes',s:2},{t:'No',s:0},{t:'Sometimes',s:1}]},

  {type:'multi',sec:1,text:'In your relationships with others you often...',
    img:'assets/question_11_with_image.a87c9d43.webp',answers:[
    {t:'Keep the distance',s:2},{t:'Easily open after knowing someone',s:0},
    {t:'Try not to get attached',s:2},{t:'Attach too quickly',s:1},
    {t:'Struggle to express your feelings',s:2},{t:'Avoid conflict at all costs',s:1}]},

  {type:'stmt',sec:1,lbl:"Can you relate to this statement?",
    stmt:'"I am repeatedly drawn to people who treat me poorly."',answers:[
    {t:'Strongly relate',s:2},{t:'Somewhat relate',s:1},{t:'Hardly relate',s:0},{t:"Can't relate",s:0}]},

  // POPUP: Testimonial
  {type:'popup',popup:'testimonial'},

  {type:'audio',sec:1,file:'assets/audio_03.mp3',

  idx:0, gender:null, age:null, name:'', email:'',

// ── HELPERS ───────────────────────────────────────────────────────────────
function item(){return FLOW[S.idx]}
function isQ(f){return f&&['q','multi','stmt','audio'].includes(f.type)}

function secProg(s){
  const items=FLOW.filter(f=>isQ(f)&&f.sec===s);
  if(!items.length)return 0;
  const first=FLOW.findIndex(f=>isQ(f)&&f.sec===s);
  let done=0;
  for(let i=first;i<S.idx;i++)if(isQ(FLOW[i])&&FLOW[i].sec===s)done++;
  return done/items.length;
}

function catScores(){
  const qs=FLOW.map((f,i)=>isQ(f)?i:-1).filter(i=>i>=0);
  const cats=[
    {lbl:'Emotional Dysregulation',   p:[4,5,8,9]},
    {lbl:'Identity Disturbance',      p:[2,3,13]},
    {lbl:'Impulsive Behaviours',      p:[6,7]},
    {lbl:'Interpersonal Relationship',p:[14,15]},
  ];
  return cats.map(c=>{
    let tot=0,got=0;
    c.p.forEach(p=>{
      const fi=qs[p];
      if(fi!==undefined&&FLOW[fi]){
        tot+=Math.max(...FLOW[fi].answers.map(a=>a.s));
        got+=(S.scores[fi]||0);
      }
    });
    return{lbl:c.lbl,pct:tot>0?Math.round(got/tot*100):45};
  });
}

// ── AUDIO ─────────────────────────────────────────────────────────────────
function startMusic(){
  if(S.musicStarted)return;
  S.musicStarted=true;
  const m=document.getElementById('bg-music');
  m.volume=0.2;
  m.play().catch(()=>{});
}

function playClick(){
  const s=document.getElementById('sfx-click');
  if(s){s.currentTime=0;s.play().catch(()=>{})}
}

function toggleQAudio(file){
  const a=document.getElementById('q-audio');
  const btn=document.getElementById('play-btn');
  const wave=document.getElementById('waveform');
  if(!a)return;
  if(a.src!==location.origin+'/'+file&&a.src!==file){
    a.src=file;
  }
  if(a.paused){
    a.play();
    btn&&btn.classList.add('playing');
    wave&&wave.classList.add('playing');
    a.onended=()=>{btn&&btn.classList.remove('playing');wave&&wave.classList.remove('playing')};
  }else{
    a.pause();
    btn&&btn.classList.remove('playing');
    wave&&wave.classList.remove('playing');
  }
}

function stopQAudio(){
  const a=document.getElementById('q-audio');
  if(a&&!a.paused){a.pause();a.currentTime=0}
  const btn=document.getElementById('play-btn');
  const wave=document.getElementById('waveform');
  btn&&btn.classList.remove('playing');
  wave&&wave.classList.remove('playing');
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  const it=item();
  if(!it)return;

  // If popup is open, show it over current content
  if(S.popup){renderPopup(app);return}

  switch(it.type){
    case 'gender':  app.innerHTML=rGender(); break;
    case 'age':     app.innerHTML=rAge(); break;
    case 'q':       app.innerHTML=rQ(it); break;
    case 'multi':   app.innerHTML=rMulti(it); break;
    case 'stmt':    app.innerHTML=rStmt(it); break;
    case 'audio':   app.innerHTML=rAudio(it); break;
    case 'popup':   S.popup=it.popup; renderPopup(app); break;
    case 'name':    app.innerHTML=rName(); break;
    case 'loading': app.innerHTML=rLoading(); startLoadingAnim(); break;
    case 'email':   app.innerHTML=rEmail(); break;
    case 'results': app.innerHTML=rResults(); startScoreAnim(); break;
    default:        advance();
  }
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────
function pickGender(g){
  playClick();S.gender=g;render();
  setTimeout(()=>{S.idx=1;render()},200);
}
function pickAge(a){
  playClick();S.age=a;render();
  setTimeout(()=>{S.idx=2;startMusic();render()},200);
}

function pickAns(i){
  playClick();
  const it=item();
  S.scores[S.idx]=it.answers[i].s;
  stopQAudio();
  advance();
}

function toggleMulti(i){
  playClick();
  if(!S.multiSel[S.idx])S.multiSel[S.idx]={};
  S.multiSel[S.idx][i]=!S.multiSel[S.idx][i];
  render();
}

function submitMulti(){
  playClick();
  const sel=S.multiSel[S.idx]||{};
  const it=item();
  const score=Object.keys(sel).filter(k=>sel[k]).reduce((sum,k)=>sum+it.answers[k].s,0);
  S.scores[S.idx]=Math.min(score,2);
  advance();
}

function closePopup(){
  playClick();
  S.popup=null;
  advance();
}

function submitName(){
  const val=document.getElementById('name-input')?.value||'';
  S.name=val.trim();
  playClick();
  advance();
}

function submitEmail(){
  const val=document.getElementById('email-input')?.value||'';
  S.email=val.trim();
  playClick();
  advance();
}

function advance(){
  S.idx++;
  if(S.idx>=FLOW.length)return;
  render();
}

function goBack(){
  if(S.popup){S.popup=null;render();return}
  if(S.idx<=0)return;
  stopQAudio();
  S.idx--;
  while(S.idx>1&&FLOW[S.idx].type==='popup')S.idx--;
  render();
}

// ── LOADING ANIMATION ─────────────────────────────────────────────────────
const LQ_TIMES=[1200,2400,3600];
let lqActive=-1;

function startLoadingAnim(){
  [400,1100,1900,2700].forEach((d,i)=>setTimeout(()=>{
    const el=document.getElementById('ls'+i);if(el)el.classList.add('on');
  },d));

  LQ_TIMES.forEach((t,i)=>setTimeout(()=>showLQ(i),t));

  setTimeout(()=>{
    if(FLOW[S.idx]&&FLOW[S.idx].type==='loading')advance();
  },5200);
}

function showLQ(i){
  if(lqActive>=0){
    const prev=document.getElementById('lq'+lqActive);
    if(prev)prev.style.display='none';
  }
  lqActive=i;
  const el=document.getElementById('lq'+i);
  if(el){el.style.display='flex';setTimeout(()=>el.classList.add('show'),50)}
}

function answerLQ(){
  playClick();
  const el=document.getElementById('lq'+lqActive);
  if(el){el.classList.remove('show');setTimeout(()=>{el.style.display='none'},400)}
  lqActive=-1;
}

// ── SCORE ANIMATION ───────────────────────────────────────────────────────
function startScoreAnim(){
  setTimeout(()=>{
    document.querySelectorAll('.score-fill').forEach(el=>{el.style.width=el.dataset.pct+'%'});
  },200);
}

// ── INIT ──────────────────────────────────────────────────────────────────
